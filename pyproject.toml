[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosttrace"
version = "1.0.0"
authors = [
  { name="SHYAM S", email="144871368+SridharShyam@users.noreply.github.com" },
]
description = "Deterministic AI trace and slop detection engine with academic IEEE support, LaTeX parsing, burstiness metrics, and human replacement guidance."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ai-detector", "anti-slop", "academic-writing", "latex", "ieee", "burstiness", "humanizer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
"Homepage" = "https://github.com/SridharShyam/GhostTrace"
"Bug Tracker" = "https://github.com/SridharShyam/GhostTrace/issues"

[project.scripts]
ghosttrace = "ghosttrace.engine:main"

[tool.setuptools.packages.find]
where = ["src"]
